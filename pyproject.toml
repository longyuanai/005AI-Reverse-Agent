[tool.poetry]
name = "ai-reverse-agent"
version = "0.1.0"
description = "AI reverse-engineering helper — seventh project of the longyuanai suite"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ai_reverse_agent", from = "src" }]
include = [
    { path = "src/ai_reverse_agent/data/*.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
rich = "^13.7.1"
capstone = "^5.0.9"
# Optional: only `analyzer`, `adapter`, and `findings` need it. The static
# analysis layers (disassembly, decompilation, CFG, crypto, IAT) do not, so
# the repository stays installable and testable on its own.
shared-llm-core = { path = "../000shared-llm-core", develop = true, optional = true }

[tool.poetry.extras]
suite = ["shared-llm-core"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"
ruff = "^0.6"
# Used only by tests/integration, which skips itself when they are absent.
httpx = "^0.27"
uvicorn = "^0.30"

[tool.poetry.scripts]
ai-reverse-agent = "ai_reverse_agent.cli:main"

# Poetry v1 spelling of entry points. The previous `[project.entry-points.…]`
# table was PEP 621 syntax without a `[project]` table, which is invalid.
[tool.poetry.plugins."longyuanai.reverse_rules"]
cff = "ai_reverse_agent.deobfuscation.cff:ControlFlowFlatteningRule"
opaque_predicate = "ai_reverse_agent.deobfuscation.opaque_pred:OpaquePredicateRule"
string_xor = "ai_reverse_agent.deobfuscation.string_xor:XorStringRule"
string_rc4 = "ai_reverse_agent.deobfuscation.string_rc4:Rc4StringRule"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp --strict-markers"
markers = [
    "integration: requires the sibling 000shared-integration checkout and a live gateway",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "UP", "ARG", "RUF"]
ignore = [
    "UP037",   # quoted annotations are used for self-referencing dataclasses
    "SIM108",  # explicit if/else is clearer than ternaries in parser code
    "UP042",   # `str, Enum` is load-bearing: .value is serialized into findings
    "RUF002",  # docstrings intentionally use × and other typographic characters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"src/ai_reverse_agent/__init__.py" = ["F401"]  # TYPE_CHECKING re-export block
