[tool.poetry]
name = "ai-reverse-agent"
version = "0.1.0"
description = "AI reverse-engineering helper — seventh project of the longyuanai suite"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ai_reverse_agent", from = "src" }]
include = ["src/ai_reverse_agent/decompilers/scripts/ExportDecompilation.java"]

[tool.poetry.dependencies]
python = "^3.11"
shared-llm-core = { path = "../000shared-llm-core", develop = true }
click = "^8.1.7"
rich = "^13.7.1"
capstone = "^5.0.9"
pefile = ">=2023.2.7"
pyelftools = ">=0.31"
networkx = ">=3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"
yara-python = "^4.5.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."longyuanai.reverse_rules"]
cff = "ai_reverse_agent.deobfuscation.cff:ControlFlowFlatteningRule"
opaque_predicate = "ai_reverse_agent.deobfuscation.opaque_pred:OpaquePredicateRule"
string_xor = "ai_reverse_agent.deobfuscation.string_xor:XorStringRule"
string_rc4 = "ai_reverse_agent.deobfuscation.string_rc4:Rc4StringRule"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
