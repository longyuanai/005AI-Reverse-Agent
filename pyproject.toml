[tool.poetry]
name = "ai-reverse-agent"
version = "0.1.0"
description = "AI reverse-engineering helper — seventh project of the longyuanai suite"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ai_reverse_agent", from = "src" }]
include = [
    "src/ai_reverse_agent/decompilers/scripts/ExportDecompilation.java",
    { path = "src/ai_reverse_agent/data/*.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
shared-llm-core = { path = "../000shared-llm-core", develop = true }
click = "^8.1.7"
rich = "^13.7.1"
capstone = "^5.0.9"
pefile = ">=2023.2.7"
pyelftools = ">=0.31"
networkx = ">=3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"
yara-python = "^4.5.4"
ruff = ">=0.6"

[tool.poetry.scripts]
ai-reverse-agent = "ai_reverse_agent.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."longyuanai.reverse_rules"]
cff = "ai_reverse_agent.deobfuscation.cff:ControlFlowFlatteningRule"
opaque_predicate = "ai_reverse_agent.deobfuscation.opaque_pred:OpaquePredicateRule"
string_xor = "ai_reverse_agent.deobfuscation.string_xor:XorStringRule"
string_rc4 = "ai_reverse_agent.deobfuscation.string_rc4:Rc4StringRule"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "UP", "ARG", "RUF"]
ignore = [
    "E501",    # long literals and messages; formatting is not enforced here
    "UP037",   # quoted annotations are used for self-referencing dataclasses
    "SIM108",  # explicit if/else is clearer than ternaries in parser code
    "UP042",   # `str, Enum` is load-bearing: .value is serialized into findings
    "RUF002",  # docstrings intentionally use × and other typographic characters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# Backend and solver classes implement shared protocols, so they keep the
# full signature even when one implementation ignores an argument.
"src/ai_reverse_agent/backends/*" = ["ARG002"]
"src/ai_reverse_agent/integrations/*" = ["ARG002"]
"src/ai_reverse_agent/symbolic.py" = ["ARG002"]
